<div
  class="task-panel-root"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="panelTitle"
  (keydown)="onKeydown($event)"
>
  <div class="task-panel-backdrop" (click)="onBackdropClick()"></div>

  <aside class="task-panel">
    <header class="task-panel__header">
      <h2 class="task-panel__title">{{ panelTitle }}</h2>
      <button type="button" class="btn btn-ghost btn-sm" (click)="close()" [disabled]="saving()">
        Close
      </button>
    </header>

    <form class="task-panel__body stack" (submit)="onSubmit($event)">
      <div class="field">
        <label for="task-title">Title</label>
        <input
          id="task-title"
          #titleInput
          type="text"
          autocomplete="off"
          [formField]="taskForm.title"
        />
      </div>

      <div class="field">
        <label for="task-description">Body</label>
        <textarea
          id="task-description"
          rows="4"
          [formField]="taskForm.description"
        ></textarea>
      </div>

      @if (formError(); as err) {
        <div class="alert alert-error" role="alert">{{ err }}</div>
      }

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ mode().kind === 'create' ? 'Add task' : 'Save' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="saving()">
          Cancel
        </button>
      </div>

      @if (mode().kind === 'edit') {
        <div class="task-panel__danger">
          @if (!confirmDelete()) {
            <button
              type="button"
              class="btn btn-danger-text btn-sm"
              (click)="onRequestDelete()"
              [disabled]="saving()"
            >
              Delete
            </button>
          } @else {
            <div class="stack-sm">
              <p class="flush muted">Delete this task?</p>
              <div class="form-actions">
                <button
                  type="button"
                  class="btn btn-danger btn-sm"
                  (click)="onConfirmDelete()"
                  [disabled]="saving()"
                >
                  Delete
                </button>
                <button
                  type="button"
                  class="btn btn-secondary btn-sm"
                  (click)="onCancelDelete()"
                  [disabled]="saving()"
                >
                  Keep
                </button>
              </div>
            </div>
          }
        </div>
      }
    </form>
  </aside>
</div>
